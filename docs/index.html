    <style>
      @font-face {
        font-family: "CrowMark";
        src: url("/text/CrowMark.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --zinc-50: #fafafa;
        --zinc-100: #f4f4f5;
        --zinc-200: #e4e4e7;
        --zinc-300: #d4d4d8;
        --zinc-500: #71717a;
        --zinc-700: #3f3f46;
        --zinc-800: #27272a;
        --zinc-900: #18181b;
        --violet-400: #a78bfa;
        --violet-500: #8b5cf6;
        --violet-600: #7c3aed;

        /* face `--shadow-small1` / `--shadow-small2`. */
        --shadow-small1: rgba(0, 0, 0, 0.05) 0px 0px 0px 1px;
        --shadow-small2:
          rgba(0, 0, 0, 0.05) 0px 0px 0px 2px,
          rgba(0, 0, 0, 0.06) 0px 1px 2px 0px;

        /* face `--text-base` is 17px and `--text-h1` is 48px.
         * CrowMark's `fontSizeMultiplier` only applies on the
         * numeric-size path in `type/compat.tsx`, and H1 / H2 / P
         * all go through the class-name path, so these are the
         * literal rendered sizes. */
        --text-base: 17px;
        /* face's `--text-h1` is 48px. Dialled down here because
         * the name sits under a 512px portrait rather than the
         * 64px logo clue.surf puts above it. */
        --text-h1: 36px;

        /* face `--radius-sm`. */
        --radius-sm: 4px;

        /* Verbatim from clue.surf's `site/tool/style/fonts.css`.
         * `brightness(0) saturate(100%)` flattens the source to
         * pure black first so the tint lands on the same violet
         * the inline SVGs reach through `fill`. */
        --purple-filter: brightness(0) saturate(100%) invert(33%) sepia(38%)
          saturate(3697%) hue-rotate(250deg) brightness(83%) contrast(116%);
        --dark-purple-filter: brightness(0) saturate(100%) invert(59%)
          sepia(23%) saturate(5550%) hue-rotate(219deg) brightness(103%)
          contrast(101%);
        --mostly-invert-filter: invert(80%);

        --page: #ffffff;
        --heading: var(--zinc-800);
        --body: var(--zinc-700);
        --quiet: var(--zinc-500);
        --card: var(--zinc-50);
        --card-border: var(--zinc-100);
        --card-text: var(--zinc-700);
        --rule: var(--zinc-200);
        --icon: var(--zinc-800);
        --icon-hover: var(--violet-600);

        /* face's `html, body` sets `font-weight: 500`, so anything
         * without its own weight utility lands on 500. Cards are
         * exactly that case in light mode, and their
         * `dark:font-medium` is also 500, so cards are 500 in both
         * modes. Paragraphs differ: `theme-body-1-colors` applies
         * `font-normal`, which `dark:font-semibold` then beats in
         * dark. Same story for the tagline via
         * `theme-tagline-1-colors`. */
        --base-weight: 500;
        --card-weight: 500;
        --body-weight: 400;
        --tagline-weight: 400;

        /* face's global `::selection`, plus the tighter pair
         * `box-card` scopes to its own subtree. */
        --select-background: #f5f5f5;
        --select-text: rgb(24, 24, 27);
        --select-card-background: #e5e5e5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #000000;
          --heading: var(--zinc-200);
          --body: var(--zinc-300);
          --quiet: var(--zinc-500);
          --card: var(--zinc-800);
          --card-border: var(--zinc-900);
          --card-text: var(--zinc-200);
          --card-weight: 500;
          --body-weight: 600;
          --tagline-weight: 600;
          --rule: var(--zinc-800);
          --icon: var(--zinc-500);
          --icon-hover: var(--violet-400);

          --select-background: #3f3f46;
          --select-text: rgb(244, 244, 245);
          --select-card-background: #52525b;
        }

        /* face/style/head.css scopes this to `*` in dark. */
        * {
          scrollbar-color: rgb(100, 116, 139);
        }
      }

      ::selection {
        background-color: var(--select-background);
        color: var(--select-text);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* face/style/head.css declares `font-size: 17px;
       * font-weight: 500; line-height: 1.5` on `html, body`
       * together, so every element without its own weight utility
       * inherits 500 rather than the browser's 400. */
      html,
      body {
        background: var(--page);
        color: var(--body);
        font-size: var(--text-base);
        font-weight: var(--base-weight);
        line-height: 1.5;
        font-family: "CrowMark", monospace;
      }

      body {
        margin: 0;
        min-height: 100vh;
        /* Lets the UA paint scrollbars and form controls in the
         * matching scheme rather than always-light. */
        color-scheme: light dark;
        /* `.font-CrowMark` in face/style/text.css. The negative
         * tracking and the hairline text-shadow are what give
         * CrowMark its inked weight on screen. */
        letter-spacing: -0.04em;
        text-shadow: 0.02em 0 currentColor;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* The layout's middle track is `minmax(0, 888px)` with no
       * horizontal padding of its own, which is why every heading
       * and paragraph below carries its own 16px inline padding.
       * Top is `pt-64`. Bottom is the page's own `pb-128` plus
       * MainContent's `pb-64`. */
      main {
        max-width: 888px;
        margin: 0 auto;
        padding-top: 64px;
        padding-bottom: 192px;
      }

      section {
        padding-bottom: 16px;
      }

      h1 {
        margin: 0;
        padding: 0 16px;
        width: 100%;
        font-size: var(--text-h1);
        line-height: 1.5;
        font-weight: 400;
        /* text-transform: uppercase; */
        /* clue.surf overrides face's `tracking-wide-015` with an
         * important `-tracking-[0.05em]` on the landing H1. */
        /* letter-spacing: -0.05em; */
        text-align: center;
        color: var(--heading);
        transform: scaleY(0.9);
      }

      h2 {
        margin: 16px 0 8px;
        padding: 0 16px;
        width: 100%;
        font-size: var(--text-base);
        line-height: 1.5;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--heading);
        transform: scaleY(0.87);
      }

      section:first-of-type h2 {
        margin-top: 0;
      }

      p {
        margin: 0 0 8px;
        padding: 0 16px;
        font-weight: var(--body-weight);
      }

      p:last-child {
        margin-bottom: 0;
      }

      /* face's secondary paragraph tier, `theme-tagline-1`. */
      .tagline {
        color: var(--quiet);
        opacity: 0.8;
        font-weight: var(--tagline-weight);
        text-align: center;
      }

      /* clue.surf sizes its main graphic at 512px, dropping to
       * 256px at viewports of 512px or under, inside a
       * `justify-center pb-32` wrapper. */
      .portrait {
        display: flex;
        justify-content: center;
        padding-bottom: 24px;
      }

      .portrait img {
        width: 192px;
        height: 192px;
        max-width: 100%;
        height: auto;
        user-select: none;
      }

      @media (max-width: 512px) {
        .portrait img {
          width: 256px;
        }
      }

      @media (prefers-color-scheme: dark) {
        .portrait img {
          filter: invert(100%);
          opacity: 0.7;
        }
      }

      /* `IconLink` on clue.surf: 20px box, 70% resting opacity,
       * 16px gap, 16px margin. */
      .icons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        margin: 16px;
      }

      .icons a {
        display: block;
        width: 20px;
        height: 20px;
        opacity: 0.7;
      }

      .icons svg {
        display: block;
        width: 100%;
        height: 100%;
        fill: var(--icon);
        transition: fill 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .icons a:hover svg {
        fill: var(--icon-hover);
      }

      /* The ClueSurf mark is a transparent black PNG rather than
       * inline SVG, so it recolors through the same filter chains
       * clue.surf declares in `site/tool/style/fonts.css`
       * (`--purple-filter`, `--dark-purple-filter`,
       * `--mostly-invert-filter`) instead of through `fill`. */
      .icons img {
        display: block;
        width: 100%;
        height: 100%;
        transition: filter 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .icons a:hover img {
        filter: var(--purple-filter);
      }

      @media (prefers-color-scheme: dark) {
        .icons img {
          filter: var(--mostly-invert-filter);
        }

        .icons a:hover img {
          filter: var(--dark-purple-filter);
        }
      }

      /* `<div className='p-16 flex flex-col gap-16 pb-32'>` around
       * clue.surf's project grid. */
      .grid-wrap {
        padding: 16px 16px 32px;
      }

      /* face's `block-cq` grid, `maxColumns={2} minWidth={256}
       * gap={16}`. Rows are flex-wrap with a 16px gap; each cell
       * is `calc(100% / 2 - 8px)` once the container clears
       * `2 * 256 + 16 = 528px`, and full width below that. */
      .grid {
        container-type: inline-size;
      }

      /* `align` defaults to `left`, so `justifyFor` gives
       * `flex-start` and `rowMarginsFor` gives `0 / auto`. With no
       * `maxWidth` the row is uncapped. */
      .grid-row {
        display: flex;
        flex-wrap: wrap;
        column-gap: 16px;
        row-gap: 16px;
        justify-content: flex-start;
        margin-left: 0;
        margin-right: auto;
        max-width: none;
      }

      .grid-cell {
        display: flex;
        flex-direction: column;
        flex: 0 0 100%;
        min-width: 256px;
      }

      @container (min-width: 528px) {
        .grid-cell {
          flex: 0 0 calc(100% / 2 - 8px);
        }
      }

      /* `box-card` + `theme-card-lift` + `theme-hover`, with
       * clue.surf's `DisplayItem` spacing (`gap-8 p-32 h-full`). */
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 16px;
        height: 100%;
        overflow: hidden;
        text-align: center;
        text-decoration: none;
        color: var(--card-text);
        font-weight: var(--card-weight);
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-small1);
        transition: box-shadow 200ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card:hover {
        box-shadow: var(--shadow-small2);
      }

      .card span {
        display: block;
        transition: color 200ms ease;
      }

      .card .name {
        font-weight: 700;
      }

      .card .about {
        color: var(--quiet);
      }

      /* `theme-hover` fades every `theme-hover-element` child to
       * violet-500, the label and the subtitle both. */
      .card:hover span {
        color: var(--violet-500);
      }

      /* `box-card` overrides the global `::selection` band inside
       * its own subtree, one step darker in each mode. */
      .card ::selection {
        background-color: var(--select-card-background);
      }

      /* The biography sits at the very bottom, per
       * `note/tool/personal-website-design.md`. */
      .bio {
        margin-top: 64px;
        padding-top: 32px;
        border-top: 1px solid var(--rule);
      }

      .bio p {
        color: var(--quiet);
        font-weight: 400;
      }
    </style>
